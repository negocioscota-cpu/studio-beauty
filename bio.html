<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bio — LashBrow</title>
  <meta name="description" content="Agende, veja o portfólio, indique e ganhe ou entre em contato." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    :root{--primary:#C4758A;--primary-light:#e8a4b8;--gold:#C9A96E;--bg:#120810;--surface:#1e1018;--surface-2:#2a1520;--border:rgba(196,117,138,.18);--text:#f0e6ea;--text-muted:rgba(240,230,234,.55)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}

    /* Loading */
    #bio-loading{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#120810,#1e0a14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
    .spin{width:36px;height:36px;border:3px solid rgba(196,117,138,.2);border-top-color:#C4758A;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .logo-text{font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,#e8a4b8,#C9A96E);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

    /* App */
    #bio-app{display:none;width:100%;max-width:440px;padding:40px 24px 60px;flex-direction:column;align-items:center;gap:0}

    /* Background decoration */
    body::before{
      content:'';position:fixed;inset:0;pointer-events:none;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%,rgba(196,117,138,.18),transparent),
        radial-gradient(ellipse 60% 40% at 80% 80%,rgba(201,169,110,.08),transparent);
    }

    /* Avatar */
    .bio-avatar{width:96px;height:96px;border-radius:50%;background:var(--surface-2);border:3px solid var(--primary);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:2.8rem;box-shadow:0 0 0 8px rgba(196,117,138,.08),0 16px 48px rgba(0,0,0,.5);margin-bottom:20px}
    .bio-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}

    /* Name & Bio */
    .bio-name{font-size:1.5rem;font-weight:800;text-align:center;background:linear-gradient(135deg,var(--primary-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
    .bio-desc{font-size:.88rem;color:var(--text-muted);text-align:center;max-width:300px;line-height:1.55;margin-bottom:8px}
    .bio-city{font-size:.8rem;color:var(--text-muted);margin-bottom:32px;display:flex;align-items:center;gap:4px}

    /* Links */
    .bio-links{display:flex;flex-direction:column;gap:12px;width:100%}

    .bio-link{
      display:flex;align-items:center;gap:14px;
      padding:16px 20px;
      border-radius:16px;
      text-decoration:none;
      color:var(--text);
      font-weight:600;font-size:.95rem;
      border:1px solid var(--border);
      background:var(--surface);
      transition:transform .18s,box-shadow .18s,background .18s,border-color .18s;
      position:relative;overflow:hidden;
    }
    .bio-link::before{
      content:'';position:absolute;inset:0;opacity:0;
      background:linear-gradient(135deg,rgba(196,117,138,.08),rgba(201,169,110,.04));
      transition:opacity .2s;
    }
    .bio-link:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 12px 36px rgba(0,0,0,.35);border-color:rgba(196,117,138,.4)}
    .bio-link:hover::before{opacity:1}
    .bio-link:active{transform:translateY(0) scale(.99)}

    /* Variantes de cor */
    .bio-link.primary{background:linear-gradient(135deg,var(--primary),#a85570);border-color:transparent;box-shadow:0 8px 28px rgba(196,117,138,.4)}
    .bio-link.primary:hover{box-shadow:0 12px 40px rgba(196,117,138,.6)}
    .bio-link.gold{background:linear-gradient(135deg,rgba(201,169,110,.15),rgba(201,169,110,.05));border-color:rgba(201,169,110,.35)}
    .bio-link.gold:hover{border-color:var(--gold)}
    .bio-link.whatsapp{background:linear-gradient(135deg,rgba(37,211,102,.1),rgba(37,211,102,.04));border-color:rgba(37,211,102,.25)}
    .bio-link.whatsapp:hover{border-color:rgba(37,211,102,.55)}

    .bio-link-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;background:rgba(255,255,255,.06)}
    .bio-link.primary .bio-link-icon{background:rgba(255,255,255,.15)}

    .bio-link-content{flex:1}
    .bio-link-title{font-weight:700;color:var(--text);line-height:1.2}
    .bio-link.primary .bio-link-title{color:#fff}
    .bio-link-sub{font-size:.78rem;color:var(--text-muted);font-weight:400;margin-top:2px}
    .bio-link.primary .bio-link-sub{color:rgba(255,255,255,.7)}

    .bio-link-arrow{color:var(--text-muted);font-size:1.1rem;flex-shrink:0}
    .bio-link.primary .bio-link-arrow{color:rgba(255,255,255,.7)}

    /* Divisor */
    .bio-divider{width:100%;height:1px;background:var(--border);margin:8px 0}

    /* Footer */
    .bio-footer{margin-top:32px;font-size:.75rem;color:var(--text-muted);text-align:center;opacity:.6}
    .bio-footer span{color:var(--primary-light)}

    /* Animação de entrada */
    .bio-link{animation:slideUp .4s ease both}
    .bio-link:nth-child(1){animation-delay:.05s}
    .bio-link:nth-child(2){animation-delay:.1s}
    .bio-link:nth-child(3){animation-delay:.15s}
    .bio-link:nth-child(4){animation-delay:.2s}
    .bio-link:nth-child(5){animation-delay:.25s}
    .bio-link:nth-child(6){animation-delay:.3s}
    @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

    #bio-app.visible{display:flex}
  </style>
</head>
<body>

<div id="bio-loading">
  <div class="logo-text">LashBrow</div>
  <div class="spin"></div>
</div>

<div id="bio-app">

  <div class="bio-avatar" id="bio-avatar">✨</div>
  <div class="bio-name"   id="bio-name">Studio</div>
  <div class="bio-desc"   id="bio-desc"></div>
  <div class="bio-city"   id="bio-city" style="display:none">
    <span class="material-symbols-outlined" style="font-size:14px">location_on</span>
    <span id="bio-city-text"></span>
  </div>

  <div class="bio-links" id="bio-links"></div>

  <div class="bio-footer">Powered by <span>LashBrow</span> ✨</div>
</div>

<script src="js/firebase-config.js"></script>
<script>
'use strict';
const Bio = {
  studioData: null,

  async init() {
    const slug = window.location.pathname.split('/').pop();
    if (!slug) { Bio.notFound(); return; }

    try {
      const snap = await db.collection('studios').where('bookingSlug','==',slug).limit(1).get();
      if (snap.empty) { Bio.notFound(); return; }
      Bio.studioData = snap.docs[0].data();
      Bio._render();
    } catch(e) {
      console.error(e);
      Bio.notFound();
    }
  },

  _render() {
    const d   = Bio.studioData;
    const slug = d.bookingSlug;

    document.title = `${d.studioName||'Studio'} — Bio`;
    document.querySelector('meta[name="description"]').content =
      `Agende com ${d.studioName||'o studio'}, veja o portfólio e muito mais.`;

    // Avatar
    if (d.logoUrl) {
      document.getElementById('bio-avatar').innerHTML = `<img src="${d.logoUrl}" alt="Logo">`;
    }
    document.getElementById('bio-name').textContent = d.studioName || d.companyName || 'Studio';
    document.getElementById('bio-desc').textContent = d.bio || d.tagline || 'Especialista em cílios e sobrancelhas';

    if (d.city) {
      document.getElementById('bio-city').style.display = 'flex';
      document.getElementById('bio-city-text').textContent = d.city;
    }

    // Whatsapp
    const wa = d.whatsapp ? d.whatsapp.replace(/\D/g,'') : null;
    const waLink = wa ? `https://wa.me/55${wa}?text=${encodeURIComponent('Olá! Vi seu perfil e queria mais informações 😊')}` : null;

    // Links
    const links = [
      {
        href: `/booking/${slug}`,
        cls: 'primary',
        icon: '📅',
        title: 'Agendar agora',
        sub: 'Reserve seu horário online em segundos',
      },
      {
        href: `/portfolio/${slug}`,
        cls: 'default',
        icon: '📸',
        title: 'Veja meu trabalho',
        sub: 'Galeria de antes & depois dos procedimentos',
      },
      waLink ? {
        href: waLink,
        cls: 'whatsapp',
        icon: '💬',
        title: 'Falar no WhatsApp',
        sub: 'Tire dúvidas ou agende direto pelo chat',
        external: true,
      } : null,
    ].filter(Boolean);

    document.getElementById('bio-links').innerHTML = links.map(l => `
      <a class="bio-link ${l.cls}" href="${l.href}" ${l.external?'target="_blank" rel="noopener"':''}>
        <div class="bio-link-icon">${l.icon}</div>
        <div class="bio-link-content">
          <div class="bio-link-title">${l.title}</div>
          <div class="bio-link-sub">${l.sub}</div>
        </div>
        <span class="material-symbols-outlined bio-link-arrow">chevron_right</span>
      </a>`).join('');

    document.getElementById('bio-loading').style.display = 'none';
    document.getElementById('bio-app').classList.add('visible');
  },

  notFound() {
    document.getElementById('bio-loading').style.display = 'none';
    document.getElementById('bio-name').textContent = 'Studio não encontrado';
    document.getElementById('bio-desc').textContent = 'Verifique o link e tente novamente.';
    document.getElementById('bio-links').innerHTML  = '';
    document.getElementById('bio-app').classList.add('visible');
  }
};

document.addEventListener('DOMContentLoaded', () => Bio.init());
</script>
</body>
</html>
