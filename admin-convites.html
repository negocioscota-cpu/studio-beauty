<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Convites LashBrow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #c9406a;
      --primary-light: #f4c6d2;
      --gold: #c9a96e;
      --gold-light: #fff8ec;
      --bg: #f8f4f6;
      --surface: #ffffff;
      --text: #1a1a2e;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 16px;
    }

    /* Login Gate */
    #login-gate {
      max-width: 400px;
      margin: 80px auto;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 40px 32px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    #login-gate h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; }
    #login-gate p { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 24px; }

    /* App */
    #admin-app { max-width: 760px; margin: 0 auto; display: none; }
    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 32px;
    }
    .page-header h1 { font-size: 1.6rem; font-weight: 800; }
    .page-header p { color: var(--text-secondary); font-size: 0.88rem; margin-top: 2px; }

    /* Card */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }
    .card h3 {
      font-size: 1rem; font-weight: 700;
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 8px;
    }

    /* Form */
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; display: block; }
    .form-control {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px; font-family: inherit; font-size: 0.9rem;
      transition: border-color .2s;
      outline: none;
    }
    .form-control:focus { border-color: var(--primary); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 560px) { .form-row { grid-template-columns: 1fr; } }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: 8px;
      font-family: inherit; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; border: none; transition: all .2s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: #b03358; transform: translateY(-1px); }
    .btn-ghost { background: transparent; border: 1.5px solid #e5e7eb; color: var(--text); }
    .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }
    .btn-full { width: 100%; justify-content: center; }
    .btn-google {
      width: 100%; padding: 12px; border-radius: 8px;
      border: 1.5px solid #e5e7eb; background: #fff;
      font-family: inherit; font-size: 0.9rem; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: all .2s;
    }
    .btn-google:hover { border-color: #4285F4; background: #f8faff; }

    /* Invite list */
    .invite-list { display: flex; flex-direction: column; gap: 12px; }
    .invite-item {
      border: 1.5px solid #e5e7eb; border-radius: 10px;
      padding: 16px; transition: border-color .2s;
    }
    .invite-item:hover { border-color: var(--primary-light); }
    .invite-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .invite-code {
      font-family: 'Courier New', monospace; font-size: 1rem; font-weight: 700;
      color: var(--primary); letter-spacing: 1px;
    }
    .invite-label { font-size: 0.82rem; color: var(--text-secondary); margin-top: 2px; }
    .badge {
      font-size: 0.72rem; font-weight: 600; padding: 3px 10px;
      border-radius: 20px; white-space: nowrap;
    }
    .badge-active { background: #d1fae5; color: #065f46; }
    .badge-inactive { background: #fee2e2; color: #991b1b; }
    .invite-meta {
      display: flex; gap: 20px; margin-top: 12px; padding-top: 12px;
      border-top: 1px solid #f3f4f6; flex-wrap: wrap;
    }
    .invite-meta-item { font-size: 0.8rem; color: var(--text-muted); }
    .invite-meta-item strong { color: var(--text-secondary); font-weight: 600; }
    .invite-link-area {
      margin-top: 12px; display: flex; gap: 8px; align-items: center;
    }
    .invite-link-input {
      flex: 1; padding: 8px 12px;
      border: 1px solid #e5e7eb; border-radius: 6px;
      font-size: 0.78rem; color: var(--text-secondary);
      background: #f9fafb; font-family: inherit;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      outline: none;
    }
    .btn-copy {
      padding: 8px 14px; border-radius: 6px;
      background: var(--gold-light); color: #8b6914;
      border: 1px solid var(--gold); font-family: inherit;
      font-size: 0.8rem; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 4px;
      white-space: nowrap; transition: all .15s;
    }
    .btn-copy:hover { background: #fdefc8; }
    .btn-copy.copied { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }

    .empty-state {
      text-align: center; padding: 40px 20px; color: var(--text-muted);
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }

    /* Toast */
    #toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #1a1a2e; color: #fff;
      padding: 12px 20px; border-radius: 10px;
      font-size: 0.88rem; font-weight: 500;
      transform: translateY(80px); opacity: 0;
      transition: all .3s; z-index: 9999;
    }
    #toast.show { transform: translateY(0); opacity: 1; }

    .btn-logout-top {
      font-size: 0.82rem; color: var(--text-muted);
      background: none; border: none; cursor: pointer;
      display: flex; align-items: center; gap: 4px;
      font-family: inherit;
    }
    .btn-logout-top:hover { color: var(--primary); }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Tabela de usuários */
    .users-section {
      margin-top: 14px; padding-top: 14px;
      border-top: 1px dashed #e5e7eb;
    }
    .users-title {
      font-size: 0.78rem; font-weight: 700;
      color: var(--text-secondary); margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; user-select: none;
    }
    .users-title:hover { color: var(--primary); }
    .users-table-wrap { overflow-x: auto; }
    .users-table {
      width: 100%; border-collapse: collapse;
      font-size: 0.78rem;
    }
    .users-table th {
      text-align: left; padding: 6px 10px;
      background: #f9fafb; color: var(--text-secondary);
      font-weight: 600; font-size: 0.72rem;
      border-bottom: 1px solid #e5e7eb;
    }
    .users-table td {
      padding: 7px 10px; color: var(--text);
      border-bottom: 1px solid #f3f4f6;
    }
    .users-table tr:last-child td { border-bottom: none; }
    .users-table tr:hover td { background: #fafafa; }
    .no-users {
      font-size: 0.78rem; color: var(--text-muted);
      padding: 8px 0; font-style: italic;
    }
  </style>
</head>
<body>

<!-- ========== LOGIN GATE ========== -->
<div id="login-gate">
  <div style="font-size: 2.5rem; margin-bottom: 12px;">🔐</div>
  <h2>Admin · LashBrow</h2>
  <p>Digite a senha de acesso ao painel de convites de parceiros.</p>
  <div style="text-align:left;margin-top:20px;">
    <div class="form-group">
      <label class="form-label">Senha de acesso</label>
      <input class="form-control" id="admin-pin-input" type="password"
             placeholder="Digite a senha" autocomplete="current-password" />
    </div>
    <button class="btn btn-primary" id="btn-admin-enter" style="width:100%;margin-top:4px;">
      Entrar
    </button>
  </div>
  <div id="gate-error" style="color:#c9406a;font-size:0.82rem;margin-top:12px;display:none;"></div>
</div>

<!-- ========== ADMIN APP ========== -->
<div id="admin-app">
  <div class="page-header">
    <div>
      <h1>🎁 Convites de Parceiros</h1>
      <p>Gerencie os links de acesso para parceiras da Lash and Beauty e outros parceiros</p>
    </div>
    <button class="btn-logout-top" id="btn-logout">
      <span class="material-symbols-outlined" style="font-size:16px">logout</span>
      Sair
    </button>
  </div>

  <!-- Criar novo convite -->
  <div class="card">
    <h3>
      <span class="material-symbols-outlined" style="color:var(--primary)">add_circle</span>
      Criar Novo Convite
    </h3>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Nome do Parceiro *</label>
        <input class="form-control" id="new-partner" placeholder="Ex: Lash and Beauty" />
      </div>
      <div class="form-group">
        <label class="form-label">Código do Convite *</label>
        <input class="form-control" id="new-code" placeholder="Ex: LASHANDBEAUTY" style="text-transform:uppercase"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Plano</label>
        <select class="form-control" id="new-plan">
          <option value="studio">Studio (1 proprietária + 2 funcionárias)</option>
          <option value="solo">Solo (1 profissional)</option>
          <option value="premium">Premium (ilimitado)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Rótulo interno</label>
        <input class="form-control" id="new-label" placeholder="Ex: Parceria Mai/2026" />
      </div>
    </div>
    <button class="btn btn-primary" id="btn-create-invite">
      <span class="material-symbols-outlined">link</span>
      Gerar Convite
    </button>
  </div>

  <!-- Lista de convites -->
  <div class="card">
    <h3>
      <span class="material-symbols-outlined" style="color:var(--gold)">format_list_bulleted</span>
      Convites Criados
    </h3>
    <div id="invite-list" class="invite-list">
      <div class="empty-state">
        <div class="icon">🔗</div>
        <div>Carregando convites...</div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>

<script>
  // ─── Config ───────────────────────────────────────────────
  // Nota: db e auth já declarados em js/firebase-config.js
  const ADMIN_EMAIL = 'negocioscota@gmail.com';
  const BASE_URL    = 'https://www.lashbrow.clientehub.app.br/app.html';

  // ─── Auth ─────────────────────────────────────────────────
  const ADMIN_PIN = 'lash@2026'; // senha de acesso ao painel
  const SESSION_KEY = 'lashbrow_admin_ok';

  function checkSession() {
    if (sessionStorage.getItem(SESSION_KEY) === '1') {
      showApp();
    } else {
      document.getElementById('login-gate').style.display = 'block';
      document.getElementById('admin-app').style.display  = 'none';
      setTimeout(() => document.getElementById('admin-pin-input').focus(), 100);
    }
  }

  function showApp() {
    document.getElementById('login-gate').style.display = 'none';
    document.getElementById('admin-app').style.display  = 'block';
    loadInvites();
  }

  document.getElementById('btn-admin-enter').addEventListener('click', () => {
    const pin = document.getElementById('admin-pin-input').value;
    if (pin === ADMIN_PIN) {
      sessionStorage.setItem(SESSION_KEY, '1');
      showApp();
    } else {
      showGateError('Senha incorreta. Tente novamente.');
      document.getElementById('admin-pin-input').value = '';
      document.getElementById('admin-pin-input').focus();
    }
  });

  document.getElementById('admin-pin-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btn-admin-enter').click();
  });

  document.getElementById('btn-logout').addEventListener('click', () => {
    sessionStorage.removeItem(SESSION_KEY);
    document.getElementById('login-gate').style.display = 'block';
    document.getElementById('admin-app').style.display  = 'none';
    document.getElementById('admin-pin-input').value = '';
  });

  function showGateError(msg) {
    const el = document.getElementById('gate-error');
    el.textContent = msg; el.style.display = 'block';
  }

  checkSession();

  // ─── Criar convite ────────────────────────────────────────
  document.getElementById('btn-create-invite').addEventListener('click', async () => {
    const partner = document.getElementById('new-partner').value.trim();
    const code    = document.getElementById('new-code').value.trim().toUpperCase().replace(/\s+/g,'');
    const plan    = document.getElementById('new-plan').value;
    const label   = document.getElementById('new-label').value.trim();
    const btn     = document.getElementById('btn-create-invite');

    if (!partner || !code) { showToast('⚠️ Preencha o parceiro e o código.'); return; }
    if (!/^[A-Z0-9_-]+$/.test(code)) { showToast('⚠️ Código só pode ter letras maiúsculas, números e hífens.'); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Criando...';

    const maxEmployees = plan === 'solo' ? 0 : plan === 'premium' ? 999 : 2;

    try {
      await db.collection('invites').doc(code).set({
        code,
        partnerName: partner,
        plan,
        subscriptionStatus: 'active',
        maxEmployees,
        active: true,
        usageCount: 0,
        users: [],
        label: label || partner,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        createdBy: 'negocioscota@gmail.com'
      });
      // Limpar campos
      document.getElementById('new-partner').value = '';
      document.getElementById('new-code').value    = '';
      document.getElementById('new-label').value   = '';
      showToast('✅ Convite criado com sucesso!');
      loadInvites();
    } catch (err) {
      showToast('❌ Erro: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined">link</span> Gerar Convite';
    }
  });

  // Auto-uppercase no campo código
  document.getElementById('new-code').addEventListener('input', e => {
    const pos = e.target.selectionStart;
    e.target.value = e.target.value.toUpperCase().replace(/\s+/g,'');
    e.target.setSelectionRange(pos, pos);
  });

  // ─── Carregar convites ────────────────────────────────────
  async function loadInvites() {
    const list = document.getElementById('invite-list');
    list.innerHTML = '<div class="empty-state"><div class="icon" style="font-size:1.5rem">⏳</div><div>Carregando...</div></div>';

    try {
      const snap = await db.collection('invites').orderBy('createdAt', 'desc').get();
      if (snap.empty) {
        list.innerHTML = '<div class="empty-state"><div class="icon">🔗</div><div>Nenhum convite criado ainda.</div></div>';
        return;
      }
      list.innerHTML = '';
      snap.forEach(doc => {
        const d = doc.data();
        list.appendChild(buildInviteItem(d));
      });
    } catch (err) {
      list.innerHTML = `<div class="empty-state"><div>Erro ao carregar: ${err.message}</div></div>`;
    }
  }

  function buildInviteItem(d) {
    const link = `${BASE_URL}?invite=${d.code}&tela=cadastro`;
    const planLabel = d.plan === 'solo' ? 'Solo' : d.plan === 'premium' ? 'Premium' : 'Studio';
    const date = d.createdAt ? new Date(d.createdAt.seconds * 1000).toLocaleDateString('pt-BR') : '—';

    // Montar linhas da tabela de usuários
    const users = d.users || [];
    let usersHTML = '';
    if (users.length === 0) {
      usersHTML = '<div class="no-users">Nenhum cadastro realizado ainda.</div>';
    } else {
      const rows = users.map(u => {
        const dt = u.usedAt ? new Date(u.usedAt).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';
        return `<tr>
          <td>${u.studioName || u.name || '—'}</td>
          <td>${u.name || '—'}</td>
          <td><a href="mailto:${u.email}" style="color:var(--primary);text-decoration:none">${u.email || '—'}</a></td>
          <td style="color:var(--text-muted)">${dt}</td>
        </tr>`;
      }).join('');
      usersHTML = `<div class="users-table-wrap">
        <table class="users-table">
          <thead><tr><th>Studio</th><th>Proprietária</th><th>E-mail</th><th>Cadastro</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    }

    const el = document.createElement('div');
    el.className = 'invite-item';
    el.innerHTML = `
      <div class="invite-header">
        <div>
          <div class="invite-code">${d.code}</div>
          <div class="invite-label">${d.label || d.partnerName}</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="badge ${d.active ? 'badge-active' : 'badge-inactive'}">${d.active ? 'Ativo' : 'Inativo'}</span>
          <button onclick="toggleInvite('${d.code}', ${!d.active})" class="btn btn-ghost" style="padding:5px 10px;font-size:0.78rem">
            ${d.active ? 'Desativar' : 'Ativar'}
          </button>
        </div>
      </div>
      <div class="invite-meta">
        <div class="invite-meta-item">Parceiro: <strong>${d.partnerName}</strong></div>
        <div class="invite-meta-item">Plano: <strong>${planLabel}</strong></div>
        <div class="invite-meta-item">Cadastros: <strong>${d.usageCount || 0}</strong></div>
        <div class="invite-meta-item">Criado: <strong>${date}</strong></div>
      </div>
      <div class="invite-link-area">
        <input class="invite-link-input" readonly value="${link}" />
        <button class="btn-copy" onclick="copyLink(this, '${link}')">
          <span class="material-symbols-outlined" style="font-size:14px">content_copy</span>
          Copiar
        </button>
        <a href="https://wa.me/?text=${encodeURIComponent('✨ Seu acesso ao LashBrow está pronto! Clique para criar sua conta: ' + link)}"
           target="_blank" class="btn-copy" style="text-decoration:none;background:#d1fae5;color:#065f46;border-color:#6ee7b7">
          <span class="material-symbols-outlined" style="font-size:14px">chat</span>
          WhatsApp
        </a>
      </div>
      <div class="users-section">
        <div class="users-title" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display==='none' ? 'block' : 'none'">
          <span class="material-symbols-outlined" style="font-size:15px">group</span>
          Profissionais cadastradas via este link (${users.length})
          <span class="material-symbols-outlined" style="font-size:13px;margin-left:auto">expand_more</span>
        </div>
        <div style="display:${users.length > 0 ? 'block' : 'none'}">${usersHTML}</div>
      </div>`;
    return el;
  }

  async function toggleInvite(code, newState) {
    try {
      await db.collection('invites').doc(code).update({ active: newState });
      showToast(newState ? '✅ Convite ativado' : '⛔ Convite desativado');
      loadInvites();
    } catch (err) { showToast('Erro: ' + err.message); }
  }

  function copyLink(btn, link) {
    navigator.clipboard.writeText(link).then(() => {
      btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px">check</span> Copiado!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px">content_copy</span> Copiar';
        btn.classList.remove('copied');
      }, 2000);
    });
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
