<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VetConnect Pro - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "tertiary-fixed-dim": "#ffafd5",
              "surface-container-low": "#f2f4f2",
              "on-background": "#191c1b",
              "surface": "#f8faf8",
              "on-surface-variant": "#41493b",
              "primary-fixed": "#abf689",
              "error": "#ba1a1a",
              "tertiary": "#9a356f",
              "outline-variant": "#c1c9b7",
              "secondary-fixed": "#ffdadb",
              "on-primary-fixed": "#052100",
              "background": "#f8faf8",
              "on-secondary-fixed": "#40000f",
              "on-error-container": "#93000a",
              "secondary": "#a93247",
              "on-primary-fixed-variant": "#175200",
              "on-tertiary": "#ffffff",
              "tertiary-fixed": "#ffd8e8",
              "on-secondary": "#ffffff",
              "primary-fixed-dim": "#90d970",
              "inverse-primary": "#90d970",
              "outline": "#717a6a",
              "tertiary-container": "#b94e89",
              "on-secondary-fixed-variant": "#891931",
              "on-secondary-container": "#730323",
              "error-container": "#ffdad6",
              "surface-container": "#eceeec",
              "on-primary-container": "#f8ffee",
              "on-error": "#ffffff",
              "surface-tint": "#296c0e",
              "surface-container-lowest": "#ffffff",
              "surface-container-high": "#e6e9e7",
              "inverse-surface": "#2e3130",
              "secondary-fixed-dim": "#ffb2b9",
              "primary-container": "#408326",
              "on-primary": "#ffffff",
              "on-tertiary-fixed": "#3d0027",
              "on-tertiary-container": "#fffbff",
              "surface-container-highest": "#e1e3e1",
              "surface-bright": "#f8faf8",
              "on-surface": "#191c1b",
              "surface-variant": "#e1e3e1",
              "surface-dim": "#d8dad9",
              "secondary-container": "#ff7386",
              "primary": "#276a0b",
              "on-tertiary-fixed-variant": "#801e59",
              "inverse-on-surface": "#eff1ef"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .vitality-gradient {
            background: linear-gradient(135deg, #276a0b 0%, #408326 100%);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
        }
        .ghost-border {
            outline: 1px solid rgba(193, 201, 183, 0.15);
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col">
<!-- Supressão da Navigation Shell de acordo com o protocolo: Login é Transactional -->
<main class="flex-grow flex items-center justify-center p-6 relative overflow-hidden">
<!-- Abstract Background Elements (Living Sanctuary feel) -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-container/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[30%] h-[30%] bg-secondary-container/5 rounded-full blur-[100px]"></div>
<div class="w-full max-w-[480px] z-10">
<!-- Brand Logo / Header Area -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-16 h-16 bg-surface-container-high rounded-xl mb-4 ghost-border">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">pets</span>
</div>
<h1 class="font-headline font-extrabold text-3xl tracking-tight text-on-surface mb-2">VetConnect Pro</h1>
<p class="font-body text-on-surface-variant text-sm">Clinical Vitality Management System</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest p-10 rounded-xl shadow-[0_24px_48px_-12px_rgba(25,28,27,0.04)] ghost-border">
<div class="mb-8">
<h2 class="font-headline font-bold text-2xl text-on-surface">Acesse sua conta</h2>
<p class="text-on-surface-variant text-sm mt-1">Bem-vindo de volta ao seu centro de cuidado animal.</p>
</div>
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label text-[0.6875rem] font-semibold uppercase tracking-wider text-on-surface-variant ml-1" for="email">E-mail Profissional</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-xl">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-high border-none rounded-xl focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline/60 text-on-surface" id="email" placeholder="nome@clinica.com.br" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-end ml-1">
<label class="block font-label text-[0.6875rem] font-semibold uppercase tracking-wider text-on-surface-variant" for="password">Senha</label>
<a class="font-label text-xs font-semibold text-secondary hover:underline transition-all" href="#">Esqueceu a senha?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-xl">lock</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-high border-none rounded-xl focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline/60 text-on-surface" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center space-x-2 px-1">
<input class="w-5 h-5 rounded-lg border-outline-variant text-primary focus:ring-primary/20 bg-surface-container-high cursor-pointer" id="remember" type="checkbox"/>
<label class="text-sm text-on-surface-variant cursor-pointer select-none" for="remember">Manter conectado neste dispositivo</label>
</div>
<!-- Login Button -->
<button class="w-full vitality-gradient text-on-primary py-4 rounded-xl font-headline font-bold text-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4" type="submit">
                        Entrar no Painel
                        <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</form>
<div class="mt-8 pt-8 border-t border-surface-container-high text-center">
<p class="text-sm text-on-surface-variant">
                        Não faz parte da rede? 
                        <a class="text-primary font-bold hover:underline transition-all ml-1" href="#">Solicite acesso à clínica</a>
</p>
</div>
</div>
<!-- Footer Metadata -->
<div class="mt-8 flex flex-col items-center gap-4">
<div class="flex gap-6">
<a class="text-[0.6875rem] font-label font-medium text-on-surface-variant hover:text-on-surface transition-colors" href="#">Termos de Uso</a>
<a class="text-[0.6875rem] font-label font-medium text-on-surface-variant hover:text-on-surface transition-colors" href="#">Privacidade</a>
<a class="text-[0.6875rem] font-label font-medium text-on-surface-variant hover:text-on-surface transition-colors" href="#">Suporte Técnico</a>
</div>
<div class="flex items-center gap-2 bg-surface-container-low px-4 py-1.5 rounded-full border border-outline-variant/10">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="text-[10px] font-label font-bold text-on-surface-variant uppercase tracking-widest">Sistemas Operacionais: Estáveis</span>
</div>
</div>
</div>
</main>
<!-- Visual Identity Strip at the very bottom -->
<div class="h-1 vitality-gradient w-full opacity-50"></div>
</body></html>
