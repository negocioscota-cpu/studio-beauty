<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfólio — LashBrow</title>
  <meta name="description" content="Veja os trabalhos do studio e agende seu horário." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    :root{--primary:#C4758A;--primary-light:#e8a4b8;--gold:#C9A96E;--bg:#120810;--surface:#1e1018;--surface-2:#2a1520;--border:rgba(196,117,138,.18);--text:#f0e6ea;--text-muted:rgba(240,230,234,.55);--radius:14px;--radius-sm:8px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    #pf-loading{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#120810,#1e0a14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
    .spin{width:36px;height:36px;border:3px solid rgba(196,117,138,.2);border-top-color:#C4758A;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .logo-text{font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,#e8a4b8,#C9A96E);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .pf-header{width:100%;background:linear-gradient(160deg,#1e0a14,#2d0f1e 60%,#1a0d22);border-bottom:1px solid var(--border);padding:36px 24px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;overflow:hidden}
    .pf-header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(196,117,138,.12),transparent);pointer-events:none}
    .studio-logo{width:84px;height:84px;border-radius:50%;background:var(--surface-2);border:3px solid var(--primary);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:14px;font-size:2.4rem;box-shadow:0 0 0 6px rgba(196,117,138,.08)}
    .studio-logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
    .studio-name{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,var(--primary-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
    .studio-tagline{font-size:.88rem;color:var(--text-muted);margin-bottom:20px}
    .header-nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
    .nav-pill{padding:8px 18px;border-radius:100px;font-size:.82rem;font-weight:600;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text-muted);cursor:pointer;transition:all .2s;text-decoration:none;display:inline-block}
    .nav-pill:hover,.nav-pill.active{background:var(--primary);border-color:var(--primary);color:#fff}
    .cta-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:linear-gradient(0deg,#1e0a14 80%,transparent);padding:20px 20px 24px;display:flex;justify-content:center}
    .cta-btn{background:linear-gradient(135deg,var(--primary),#a85570);color:#fff;border:none;border-radius:100px;padding:15px 36px;font-size:1rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;box-shadow:0 8px 32px rgba(196,117,138,.45);transition:transform .15s,box-shadow .15s;text-decoration:none;display:inline-block}
    .cta-btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(196,117,138,.6)}
    .pf-main{max-width:900px;margin:0 auto;padding:28px 16px 120px}
    .pf-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
    .filter-chip{padding:6px 16px;border-radius:100px;font-size:.8rem;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;transition:all .2s}
    .filter-chip:hover,.filter-chip.active{background:rgba(196,117,138,.15);border-color:var(--primary);color:var(--primary-light)}
    .pf-grid{columns:2;gap:12px}
    @media(min-width:600px){.pf-grid{columns:3}}
    @media(min-width:800px){.pf-grid{columns:4}}
    .pf-card{break-inside:avoid;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;cursor:pointer;transition:transform .2s,box-shadow .2s}
    .pf-card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.4)}
    .pf-before-after{display:grid;grid-template-columns:1fr 1fr;position:relative}
    .pf-img{aspect-ratio:3/4;width:100%;object-fit:cover;display:block}
    .pf-img-single{aspect-ratio:4/5;width:100%;object-fit:cover;display:block}
    .pf-ba-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:rgba(18,8,16,.8);border:2px solid var(--primary);display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:var(--primary-light);letter-spacing:-.5px}
    .pf-info{padding:10px 12px 12px}
    .pf-procedure{font-size:.8rem;font-weight:700;color:var(--primary-light);margin-bottom:2px}
    .pf-caption{font-size:.72rem;color:var(--text-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .pf-empty{text-align:center;padding:60px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;grid-column:1/-1}
    .lightbox{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.9);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:24px}
    .lightbox.open{display:flex}
    .lightbox-inner{max-width:480px;width:100%;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;animation:lbIn .25s ease}
    @keyframes lbIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
    .lightbox-close{position:fixed;top:16px;right:16px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.2rem}
    .lb-ba{display:grid;grid-template-columns:1fr 1fr}
    .lb-img{width:100%;aspect-ratio:3/4;object-fit:cover}
    .lb-single{width:100%;max-height:400px;object-fit:cover}
    .lb-info{padding:16px 20px}
    .lb-proc{font-size:.9rem;font-weight:700;color:var(--primary-light);margin-bottom:4px}
    .lb-caption{font-size:.85rem;color:var(--text-muted);margin-bottom:16px}
    .lb-book{background:linear-gradient(135deg,var(--primary),#a85570);color:#fff;border:none;border-radius:var(--radius-sm);padding:12px 20px;font-size:.9rem;font-weight:700;cursor:pointer;width:100%;font-family:'Inter',sans-serif;text-decoration:none;display:block;text-align:center}
  </style>
</head>
<body>

<div id="pf-loading"><div class="logo-text">LashBrow</div><div class="spin"></div></div>

<div id="pf-app" style="display:none">
  <div class="pf-header">
    <div class="studio-logo" id="pf-logo">✨</div>
    <div class="studio-name" id="pf-name">Studio</div>
    <div class="studio-tagline" id="pf-tagline">Portfólio de trabalhos</div>
    <div class="header-nav">
      <a class="nav-pill" id="pf-link-booking" href="#">📅 Agendar</a>
      <a class="nav-pill active" href="#">📸 Portfólio</a>
      <a class="nav-pill" id="pf-link-bio" href="#">🔗 Bio</a>
    </div>
  </div>
  <div class="pf-main">
    <div class="pf-filters" id="pf-filters"></div>
    <div class="pf-grid" id="pf-grid"></div>
  </div>
  <div class="cta-bar">
    <a class="cta-btn" id="pf-cta" href="#">✨ Agendar meu horário</a>
  </div>
</div>

<div class="lightbox" id="pf-lightbox" onclick="PF.closeLightbox(event)">
  <div class="lightbox-close" onclick="PF.closeLightbox()">✕</div>
  <div class="lightbox-inner" id="lb-inner" onclick="event.stopPropagation()"></div>
</div>

<script src="js/firebase-config.js"></script>
<script>
'use strict';
const PF = {
  studioUid: null, studioData: null, items: [], currentFilter: '',
  async init() {
    const slug = window.location.pathname.split('/').pop();
    if (!slug) { PF.notFound(); return; }
    try {
      const snap = await db.collection('studios').where('bookingSlug','==',slug).limit(1).get();
      if (snap.empty) { PF.notFound(); return; }
      const doc = snap.docs[0];
      PF.studioUid = doc.id; PF.studioData = doc.data();
      let items = [];
      try {
        const is = await db.collection('portfolio').where('userId','==',PF.studioUid).orderBy('createdAt','desc').limit(80).get();
        items = is.docs.map(d => ({id:d.id,...d.data()}));
      } catch(e){}
      PF.items = items;
      PF._header(); PF._filters(); PF._grid(items);
      document.getElementById('pf-loading').style.display = 'none';
      document.getElementById('pf-app').style.display = 'block';
    } catch(e){ console.error(e); PF.notFound(); }
  },
  notFound() {
    document.getElementById('pf-loading').style.display='none';
    document.getElementById('pf-app').style.display='block';
    document.getElementById('pf-grid').innerHTML='<div class="pf-empty"><div style="font-size:3rem">🔍</div><strong>Studio não encontrado</strong></div>';
    document.querySelector('.cta-bar').style.display='none';
  },
  _header() {
    const d = PF.studioData;
    document.title = `${d.studioName||'Studio'} — Portfólio`;
    if (d.logoUrl) document.getElementById('pf-logo').innerHTML=`<img src="${d.logoUrl}" alt="Logo">`;
    document.getElementById('pf-name').textContent    = d.studioName||d.companyName||'Studio';
    document.getElementById('pf-tagline').textContent = d.city?`${d.city} — Veja nossos trabalhos`:'Veja nossos trabalhos';
    const slug = d.bookingSlug;
    document.getElementById('pf-link-booking').href = `/booking/${slug}`;
    document.getElementById('pf-link-bio').href     = `/bio/${slug}`;
    document.getElementById('pf-cta').href          = `/booking/${slug}`;
  },
  _filters() {
    const types = ['Todos',...new Set(PF.items.map(i=>i.procedure).filter(Boolean))];
    document.getElementById('pf-filters').innerHTML = types.map(t=>`<div class="filter-chip ${t==='Todos'?'active':''}" onclick="PF.filterBy('${t}')">${t}</div>`).join('');
  },
  filterBy(type) {
    PF.currentFilter = type==='Todos'?'':type;
    document.querySelectorAll('.filter-chip').forEach(c=>c.classList.toggle('active',c.textContent===type));
    PF._grid(PF.currentFilter?PF.items.filter(i=>i.procedure===PF.currentFilter):PF.items);
  },
  _grid(items) {
    const grid = document.getElementById('pf-grid');
    if (!items.length) { grid.innerHTML='<div class="pf-empty"><div style="font-size:3rem;opacity:.35">📷</div><strong>Nenhum trabalho cadastrado ainda</strong></div>'; return; }
    grid.innerHTML = items.map((item,idx)=>`
      <div class="pf-card" onclick="PF.openLightbox(${idx})">
        ${item.afterUrl&&item.beforeUrl
          ?`<div class="pf-before-after"><img class="pf-img" src="${item.beforeUrl}" alt="Antes" loading="lazy"/><img class="pf-img" src="${item.afterUrl}" alt="Depois" loading="lazy"/><div class="pf-ba-badge">B|D</div></div>`
          :`<img class="pf-img-single" src="${item.afterUrl||item.beforeUrl||''}" alt="${item.procedure||'Trabalho'}" loading="lazy"/>`}
        <div class="pf-info">
          <div class="pf-procedure">${item.procedure||''}</div>
          ${item.caption?`<div class="pf-caption">${item.caption}</div>`:''}
        </div>
      </div>`).join('');
  },
  openLightbox(idx) {
    const list = PF.currentFilter?PF.items.filter(i=>i.procedure===PF.currentFilter):PF.items;
    const item = list[idx]; if(!item) return;
    const bk = `/booking/${PF.studioData.bookingSlug}`;
    document.getElementById('lb-inner').innerHTML=`
      ${item.afterUrl&&item.beforeUrl
        ?`<div class="lb-ba"><img class="lb-img" src="${item.beforeUrl}" alt="Antes"/><img class="lb-img" src="${item.afterUrl}" alt="Depois"/></div>`
        :`<img class="lb-single" src="${item.afterUrl||item.beforeUrl}" alt="${item.procedure||''}"/>`}
      <div class="lb-info">
        ${item.procedure?`<div class="lb-proc">${item.procedure}</div>`:''}
        ${item.caption?`<div class="lb-caption">${item.caption}</div>`:''}
        <a class="lb-book" href="${bk}">✨ Quero agendar este procedimento</a>
      </div>`;
    document.getElementById('pf-lightbox').classList.add('open');
  },
  closeLightbox(e) {
    if (e && !e.target.classList.contains('lightbox') && !e.target.classList.contains('lightbox-close')) return;
    document.getElementById('pf-lightbox').classList.remove('open');
  }
};
document.addEventListener('DOMContentLoaded',()=>PF.init());
</script>
</body>
</html>
